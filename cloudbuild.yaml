# Cloud Build trigger config for App Engine deployment.
#
# Connect this repo to GCP via:
#   Cloud Build → Triggers → Create trigger
#   Source: GitHub repo ishfuseini/agentflow-mcp
#   Event: Push to main
#
# The Cloud Build service account needs these roles:
#   roles/appengine.appAdmin   (deploy to App Engine)
#   roles/storage.objectAdmin  (access staging bucket)
#   roles/cloudbuild.builds.editor (usually default)
#
# Grant with:
#   PROJECT_ID=ishfdev-agentflow
#   SA="$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')@cloudbuild.gserviceaccount.com"
#   gcloud projects add-iam-policy-binding $PROJECT_ID \
#     --member="serviceAccount:$SA" --role="roles/appengine.appAdmin"
#   gcloud projects add-iam-policy-binding $PROJECT_ID \
#     --member="serviceAccount:$SA" --role="roles/storage.objectAdmin"

steps:
  - name: node:22
    entrypoint: npm
    args: ['ci']

  - name: node:22
    entrypoint: npm
    args: ['run', 'build']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ['app', 'deploy', 'app.yaml', '--quiet']

options:
  logging: CLOUD_LOGGING_ONLY
