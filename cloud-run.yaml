# Cloud Run service configuration for agentflow-mcp (task 9.2).
#
# Deploy:
#   gcloud run deploy agentflow-mcp \
#     --source . \
#     --region run.googleapis.com \
#     --port 8080 \
#     --set-env-vars "MCP_TRANSPORT=http-stream" \
#     --set-secrets "BRANDFETCH_API_KEY=brandfetch-api-key:latest,LOGO_DEV_SECRET_KEY=logo-dev-secret-key:latest,LOGO_DEV_PUBLISHABLE_KEY=logo-dev-publishable-key:latest"

service: agentflow-mcp

# Cloud Run injects PORT=8080 automatically. The server listens on 0.0.0.0:$PORT.
# MCP HTTP endpoint is at /mcp (FastMCP default).

# Environment variables (non-secret) — set via --set-env-vars at deploy.
env:
  MCP_TRANSPORT: "http-stream"

# Secrets — set via --set-secrets at deploy (managed by Secret Manager).
# BRANDFETCH_API_KEY — Bearer token for Brandfetch Brand Context API
# LOGO_DEV_SECRET_KEY — Bearer token for logo.dev Brand API
# LOGO_DEV_PUBLISHABLE_KEY — publishable key for logo.dev CDN URLs

# Health check: Cloud Run probes the container's TCP port by default.
# For an HTTP health endpoint, add a lightweight handler — the MCP /mcp
# endpoint responds to GET with 405 (only POST is accepted), which Cloud Run
# treats as "container is up". No custom health endpoint is needed for the POC.

# Concurrency: MCP tool calls are lightweight; default 80 is fine.
# Memory: 512 MiB is sufficient for the source pack + brand cache.
# CPU: 1 minimum for responsive tool calls during the demo.

# Timeout: set to 60s to allow Brandfetch live resolution (can take 15-30s).
# Cloud Run's default 300s request timeout is acceptable; this is the
# container startup timeout.
