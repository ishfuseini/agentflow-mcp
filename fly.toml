app = "agentflow-mcp"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  # FastMCP's /mcp endpoint only accepts POST.
  # Use TCP check (no HTTP path) so Fly doesn't flag GET / as unhealthy.
  [http_service.checks]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "512mb"
  cpu_type = "shared"
